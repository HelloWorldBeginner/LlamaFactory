### model
model: Qwen/Qwen3-8B
trust_remote_code: true
model_class: llm

template: qwen3_nothink
flash_attn: flash_attention_2          # SP 强制要求 flash_attention_2

# 用 meta 设备分块加载，避免每个 rank 都加载完整 8B (fp32 ~32GB) 导致加载阶段 OOM
init_config:
  name: init_on_meta

# Distribution / Sequence Parallel Config
# CP1 baseline: cp_size=1 (CP off). Keep dp_size identical to the CP2 run so
# rank0 sees the same data in both runs — required for a valid tensor comparison.
dist_config:
  name: fsdp2
  dcp_path: null
  cp_mode: ulysses
  cp_size: 1                            # CP off (baseline)

### data
train_dataset: data/alpaca_en_52k.yaml

### training
output_dir: outputs/test_ulysses_cp1
micro_batch_size: 1
cutoff_len: 4096                        # must be divisible by cp_size in the CP2 run
learning_rate: 1.0e-4
bf16: true                              # flash_attention_2 requires half precision
max_steps: 10
