### model
model: Qwen/Qwen3-8B
trust_remote_code: true
model_class: llm

template: qwen3_nothink
flash_attn: flash_attention_2          # SP 强制要求 flash_attention_2

# 用 meta 设备分块加载，避免每个 rank 都加载完整 8B (fp32 ~32GB) 导致加载阶段 OOM
#init_config:
#  name: init_on_meta

# Distribution / Sequence Parallel Config
# world_size must be divisible by cp_size: dp_size = world_size // cp_size
# cp_size must divide num_attention_heads (Qwen3-8B has 32 heads / 8 kv heads)
dist_config:
  name: fsdp2
  dcp_path: null
  cp_mode: ulysses                      # only ulysses is supported currently
  cp_size: 1                           # choices: 2 / 4 / 8 / 16 for Qwen3-8B

### data
train_dataset: data/v1_sft_demo.yaml

### training
output_dir: outputs/test_ulysses_cp
micro_batch_size: 1
cutoff_len: 4096                        # 8B + 长序列易 OOM，先用 4096 验证通路
learning_rate: 1.0e-4
bf16: true                              # flash_attention_2 requires half precision
max_steps: 10
